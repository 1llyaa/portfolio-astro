# Swapped in for default.conf by 05-maintenance.sh when MAINTENANCE=true.
# Every path answers 503 with the maintenance page as its body, so search
# engines treat the outage as temporary instead of dropping the pages.
server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/maintenance;

    add_header Retry-After 3600 always;
    add_header Cache-Control "no-store" always;

    error_page 503 @maintenance;

    location / {
        return 503;
    }

    location @maintenance {
        rewrite ^ /index.html break;
    }
}
